name: Caterpillar
options:
  bundleIdPrefix: me.ammaar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Caterpillar:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Native
      - path: Sources/Assets.xcassets
      - path: Sources/Resources/henge-jit.js
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # scripts/fetch_firmware.sh puts the UEFI firmware here. Without it the app still builds,
      # and the user supplies their own code.fd.
      - path: Firmware/code.fd
        buildPhase: resources
        optional: true
      - path: Firmware/edk2-licenses.txt
        buildPhase: resources
        optional: true
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Caterpillar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Lets apps in Windows hear the microphone."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: Caterpillar.entitlements
      properties:
        get-task-allow: true
    settings:
      base:
        # This is a fork of WindowsiOS and keeps its bundle identifier, so installing Caterpillar
        # over WindowsiOS keeps the disk image already on the device. Override with
        # BUNDLE_ID=... scripts/build_ipa.sh for a separate app.
        PRODUCT_BUNDLE_IDENTIFIER: me.ammaar.windowsios
        PRODUCT_NAME: Caterpillar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/Native/Caterpillar-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../core
          - $(PROJECT_DIR)/../host
          - $(PROJECT_DIR)/../devices
          - $(PROJECT_DIR)/Sources/Native
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios
          - $(PROJECT_DIR)/deps/lib
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios-sim
          - $(PROJECT_DIR)/deps-sim/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lwinvm
          - -lslirp
          - -lglib-2.0
          - -lintl
          - -lpcre2-8
          - -lffi
          - -lresolv
          - -liconv
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: SafariServices.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
